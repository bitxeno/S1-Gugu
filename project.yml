name: S1Gugu
options:
  bundleIdPrefix: app.bitxeno
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  SnapKit:
    url: https://github.com/SnapKit/SnapKit.git
    from: 5.7.0
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.8.0
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    from: 8.0.0
  SQLiteData:
    url: https://github.com/pointfreeco/sqlite-data.git
    from: 1.12.0
  SwiftyJSON:
    url: https://github.com/SwiftyJSON/SwiftyJSON.git
    from: 5.0.2

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    SWIFT_TREAT_WARNINGS_AS_ERRORS: "NO"
    # 版本号默认值。发布时 CI 用 MARKETING_VERSION=... 覆盖这两个值。
    # Info.plist 里对应写 $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION),
    # 否则版本号会被写死成 1.0(设置页也就永远显示 1.0)。
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  S1Gugu:
    type: application
    platform: iOS
    bundleId: app.bitxeno.S1Gugu
    sources:
      - path: S1Gugu
    dependencies:
      - package: SnapKit
      - package: SwiftSoup
      - package: Kingfisher
      - package: SQLiteData
      - package: SwiftyJSON
    info:
      path: S1Gugu/Info.plist
      properties:
        CFBundleDisplayName: S1 Gugu
        # 必须在这里声明,否则 xcodegen 每次生成都会把 Info.plist 的版本号重置为 1.0/1
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSPhotoLibraryAddUsageDescription: 保存帖子图片到相册时需要此权限。
        CFBundleURLTypes:
          - CFBundleURLName: com.bitxeno.s1gugu
            CFBundleURLSchemes:
              - s1gugu
        ITSAppUsesNonExemptEncryption: false
        UIUserInterfaceStyle: Automatic

  S1GuguTests:
    type: bundle.unit-test
    platform: iOS
    bundleId: app.bitxeno.S1GuguTests
    sources:
      - path: S1GuguTests
    dependencies:
      - target: S1Gugu
    info:
      path: S1GuguTests/Info.plist
      properties: {}

schemes:
  S1Gugu:
    build:
      targets:
        S1Gugu: all
    test:
      targets:
        - S1GuguTests
