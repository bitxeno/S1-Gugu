name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Archive (unsigned)
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="1.0"
          fi
          xcodebuild \
            -project S1Gugu.xcodeproj \
            -scheme S1Gugu \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            -archivePath build/S1Gugu.xcarchive \
            archive \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$VERSION"

      - name: Package IPA
        run: |
          cd build
          mkdir Payload
          cp -R "S1Gugu.xcarchive/Products/Applications/S1Gugu.app" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload S1Gugu.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: S1Gugu-${{ github.ref_name }}-unsigned
          path: build/S1Gugu.ipa
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "build/S1Gugu.ipa#S1Gugu-${GITHUB_REF_NAME}-unsigned.ipa" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes

      - name: Update AltStore source
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p build/altsource
          ICON_URL="https://raw.githubusercontent.com/${REPO}/main/docs/image/app-icon.png"

          # 以专用 AltSource release 上的 source.json 为底稿,缺失时从仓库种子起步
          if gh release view AltSource --repo "$REPO" > /dev/null 2>&1; then
            gh release download AltSource --repo "$REPO" --pattern 'source.json' \
              --output build/altsource/source.json --clobber || true
          fi
          if [[ ! -s build/altsource/source.json ]]; then
            if [[ -s source.json ]]; then
              cp source.json build/altsource/source.json
            else
              jq -n '{
                name: "S1 Gugu",
                identifier: "app.bitxeno.s1gugu.source",
                subtitle: "S1 Gugu builds.",
                description: "S1 Gugu, an iOS client for the Stage1st forum. Builds come straight from https://github.com/bitxeno/S1-Gugu/releases.",
                website: "https://github.com/bitxeno/S1-Gugu",
                tintColor: "#00B0FF",
                apps: [{
                  name: "S1 Gugu",
                  bundleIdentifier: "app.bitxeno.S1Gugu",
                  developerName: "bitxeno",
                  subtitle: "Stage1st forum iOS client",
                  localizedDescription: "S1 Gugu, an iOS client for the Stage1st forum (bbs.saraba1st.com).",
                  minOSVersion: "17.0",
                  versions: []
                }],
                news: []
              }' > build/altsource/source.json
            fi
          fi

          # 图标放在 docs/image/,source.json 引用仓库 raw URL
          jq --arg icon "$ICON_URL" '.iconURL = $icon | .apps[0].iconURL = $icon' \
            build/altsource/source.json > build/altsource/source.icon.json
          mv build/altsource/source.icon.json build/altsource/source.json

          # 版本条目:下载地址指向同 tag 的 IPA 资产
          IPA_URL="https://github.com/${REPO}/releases/download/${TAG}/S1Gugu.ipa"
          IPA_SIZE=$(stat -f%z build/S1Gugu.ipa)
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          NOTES=$(gh release view "$TAG" --repo "$REPO" --json body --jq .body)

          # 组装新版本条目(release notes 作为 localizedDescription 原样嵌入)
          jq -n --arg version "${TAG#v}" --arg date "$DATE" --arg notes "$NOTES" \
                --arg url "$IPA_URL" --arg size "$IPA_SIZE" \
                '{version: $version, date: $date, localizedDescription: $notes,
                  downloadURL: $url, size: ($size | tonumber), minOSVersion: "17.0"}' \
            > build/altsource/version.json

          # versions 已有同版本号则替换,否则插到最前
          jq --slurpfile entry build/altsource/version.json '
            .apps[0].versions =
              ([$entry[0]] + [.apps[0].versions[] | select(.version != $entry[0].version)])
          ' build/altsource/source.json > build/altsource/source.new.json
          mv build/altsource/source.new.json build/altsource/source.json

          # 专用 release 不存在则创建,然后替换其中的 source.json 资产
          if ! gh release view AltSource --repo "$REPO" > /dev/null 2>&1; then
            gh release create AltSource --repo "$REPO" \
              --title "AltStore Source" \
              --notes "Stable URL for AltStore/SideStore source.json. Icon is hosted at docs/image/app-icon.png; content is regenerated on every app release; do not edit."
          fi
          gh release upload AltSource --repo "$REPO" build/altsource/source.json --clobber
          echo "source.json uploaded to AltSource release for ${TAG}"
